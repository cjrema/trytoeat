<title>8월 2차 샘표 장류 유인행사 점검 (8/25)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg: #FAFAF7;
    --card-bg: #FFFFFF;
    --ink: #1F2E22;
    --muted: #767065;
    --line: #E6E1D6;
    --accent: #E8622C;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: 'Pretendard', sans-serif;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; padding: 36px 20px 80px; display: flex; flex-direction: column; gap: 20px; }
  .header { text-align: center; }
  .header h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; }
  .header p { font-size: 13.5px; color: var(--muted); margin: 0; }
  .card {
    background: var(--card-bg); border-radius: 18px; padding: 24px 20px;
    border: 1.5px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .form-group { position: relative; margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 14px; font-weight: 700; }
  input[type="text"] {
    width: 100%; padding: 13px 14px; border-radius: 12px;
    border: 1.5px solid var(--line); background: #F9F8F5;
    font-size: 14.5px; font-family: inherit; color: var(--ink); outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); background: #FFFFFF; }
  .suggest-list {
    position: absolute; top: calc(100% - 2px); left: 0; right: 0;
    background: #ffffff; border: 1.5px solid var(--line); border-radius: 12px;
    max-height: 180px; overflow-y: auto; margin: 4px 0 0; padding: 0;
    list-style: none; z-index: 1000; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
  }
  .suggest-item { padding: 11px 14px; font-size: 14px; font-weight: 600; cursor: pointer; border-bottom: 1px solid #F4F3EE; }
  .suggest-item:hover { background: #F4F3EE; color: var(--accent); }
  .radio-group { display: flex; gap: 10px; }
  .radio-label {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; background: #F9F8F5; border: 1.5px solid var(--line);
    border-radius: 12px; font-size: 14.5px; font-weight: 700; cursor: pointer;
  }
  .radio-label:has(input:checked) { border-color: var(--accent); background: #FFF7F2; color: var(--accent); }
  .btn-submit {
    width: 100%; padding: 15px; background: var(--accent); color: #fff;
    font-size: 15.5px; font-weight: 800; border: none; border-radius: 12px; cursor: pointer;
  }
  .btn-submit:disabled { background: #B5B0A4; cursor: not-allowed; }
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <h1>8월 2차 샘표 장류 유인행사 점검 (8/25)</h1>
    <p>매장명, MD님 이름 및 유인행사 유무를 입력해 주세요.</p>
  </header>

  <section class="card">
    <form id="dataForm">
      <div class="form-group">
        <label for="martInput">마트명 검색</label>
        <input type="text" id="martInput" placeholder="마트명을 입력하거나 검색하세요" required autocomplete="off" />
        <ul id="martSuggestList" class="suggest-list" hidden></ul>
      </div>

      <div class="form-group">
        <label for="userName">이름</label>
        <input type="text" id="userName" placeholder="담당자 이름을 입력하세요" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label>유무 선택</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="hasStatus" value="유인행사 O" checked /> 유 (있음)
          </label>
          <label class="radio-label">
            <input type="radio" name="hasStatus" value="유인행사 X" /> 무 (없음)
          </label>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">데이터 전송하기</button>
    </form>
  </section>
</div>

const martInput = document.getElementById('martInput');
const suggestList = document.getElementById('martSuggestList');

martInput.addEventListener('input', (e) => {
  const query = e.target.value.trim().toLowerCase();
  if (!query) { suggestList.hidden = true; return; }
  const matches = MART_DATABASE.filter(m => m.toLowerCase().includes(query));
  if (matches.length === 0) {
    suggestList.innerHTML = '<li class="suggest-item" style="color:#9C988F; cursor:default;">일치하는 마트가 없습니다</li>';
    suggestList.hidden = false;
    return;
  }
  suggestList.innerHTML = matches.map(m => `<li class="suggest-item">${m}</li>`).join('');
  suggestList.hidden = false;
});

suggestList.addEventListener('click', (e) => {
  if (e.target.classList.contains('suggest-item') && !e.target.textContent.includes('일치하는')) {
    martInput.value = e.target.textContent;
    suggestList.hidden = true;
  }
});

document.addEventListener('click', (e) => {
  if (!martInput.contains(e.target) && !suggestList.contains(e.target)) suggestList.hidden = true;
});

const form = document.getElementById('dataForm');
const userName = document.getElementById('userName');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', (e) => {
  e.preventDefault();
  
  submitBtn.disabled = true;
  submitBtn.textContent = '저장 중...';

  const selectedStatus = document.querySelector('input[name="hasStatus"]:checked').value;
  const payload = {
    mart: martInput.value.trim(),
    name: userName.value.trim(),
    status: selectedStatus,
    createdAt: new Date().toLocaleString()
  };

  // 구글 시트로 비동기 전송
  fetch(GOOGLE_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
  .then(() => {
    alert('데이터가 성공적으로 등록되었습니다.');
    userName.value = '';
    martInput.value = '';
    suggestList.hidden = true;
    document.querySelector('input[name="hasStatus"][value="유인행사 O"]').checked = true;
  })
  .catch((err) => {
    alert('전송 중 오류가 발생했습니다. 다시 시도해 주세요.');
    console.error(err);
  })
  .finally(() => {
    submitBtn.disabled = false;
    submitBtn.textContent = '데이터 전송하기';
  });
});
