if(tab=='team'){const T=[...new Set(L.map(s=>s.md+'|'+s.t))];h+=`<div class="card"><h2>팀별 비교</h2><table><thead>${HEAD}</thead><tbody>`+T.map(k=>{const [m,t]=k.split('|');const l=D.s.filter(s=>s.md==m&&s.t==t);return`<tr onclick="listPop('${m} ${t}',D.s.filter(s=>s.md=='${m}'&&s.t=='${t}'),'all')"><td class="l">${m} · ${t}</td>${cells(l)}</tr>`}).join('')+'</tbody></table></div>'}
