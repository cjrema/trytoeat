<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>구매지도 참여 점검</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: 상단 요약 → 필터바 → 조직별 참여율 표 → 인원 명단. CJ 블루 중심, 노랑·빨강은 포인트만 */
:root{
  --bg:#F5F7FA; --surface:#FFFFFF; --line:#E1E6EE; --fg:#1B2533; --muted:#667386;
  --blue:#006ECD; --blue-soft:#E6F1FB; --yellow:#FF9700; --red:#EF151E; --track:#E9EEF5;
  --ok:#0B7F4F; --ok-soft:#E3F4EC; --no-soft:#FDE8E9;
  --font:"Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171F; --surface:#1A212C; --line:#2B3442; --fg:#E7ECF3; --muted:#9AA6B6;
  --blue:#4FA3EE; --blue-soft:#1B3550; --yellow:#FFAA33; --red:#FF5A60; --track:#273140;
  --ok:#4CC98E; --ok-soft:#173528; --no-soft:#3A1D20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171F; --surface:#1A212C; --line:#2B3442; --fg:#E7ECF3; --muted:#9AA6B6;
  --blue:#4FA3EE; --blue-soft:#1B3550; --yellow:#FFAA33; --red:#FF5A60; --track:#273140;
  --ok:#4CC98E; --ok-soft:#173528; --no-soft:#3A1D20; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;display:grid;gap:22px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:16px;font-weight:700;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer}
.toggle input{accent-color:var(--blue);width:16px;height:16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi.main{background:var(--blue);border-color:var(--blue);color:#fff}
.kpi.main .l,.kpi.main .v small{color:rgba(255,255,255,.85)}
.v.red{color:var(--red)}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--yellow);border-radius:6px;padding:10px 14px;font-size:13px;color:var(--muted)}
.note b{color:var(--fg)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.f{display:grid;gap:4px;min-width:0;flex:1 1 170px}
.f label{font-size:12px;color:var(--muted)}
select,input[type=search]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box}
select:focus,input:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;flex:1;border:0;background:var(--bg);color:var(--muted);padding:8px 12px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}
.reset{font:inherit;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:8px 12px;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ph .hint{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th.num,td.num{text-align:right}
th .ar{opacity:.6;font-size:10px;margin-left:3px}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--blue-soft)}
tr.sel td{background:var(--blue-soft)}
.bar{display:flex;align-items:center;gap:8px;min-width:170px}
.bar .t{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar .t i.low{background:var(--red)}
.bar .t i.mid{background:var(--yellow)}
.bar b{width:46px;text-align:right;font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--no-soft);color:var(--red)}
.pill.ex{background:var(--track);color:var(--muted);font-weight:500}
.multi{color:var(--blue);font-weight:700}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.more{font:inherit;justify-self:center;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 16px;cursor:pointer}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi.main{grid-column:span 2}}
</style>

<div class="wrap">
  <div class="head">
    <div>
      <h1>1인 1식당 구매지도 · 인원별 참여 점검</h1>
      <p class="sub">참여 여부 1 = 참여, 0 = 미참여 · 관리자 계정 제외 전체 <span id="allN"></span>명</p>
    </div>
    <label class="toggle"><input type="checkbox" id="exToggle" checked> 예외 대상(휴직 등) 제외하고 집계</label>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="note"><b>조사 식당 수 안내</b> · '응답 수'는 제출된 설문 건수입니다. 한 사람이 같은 식당을 중복 제출한 경우가 포함될 수 있어 실제 조사한 식당 수는 이보다 적을 수 있습니다.</b> 2건 이상 제출한 인원은 명단에서 파란 숫자로 표시됩니다.</div>

  <div class="filters">
    <div class="f"><label for="fMd">조직 (MD)</label><select id="fMd"></select></div>
    <div class="f"><label for="fTeam">팀 (MD팀)</label><select id="fTeam"></select></div>
    <div class="f" style="flex:0 1 auto"><label>참여 상태</label>
      <div class="seg" id="fStatus"><button data-v="all" class="on">전체</button><button data-v="1">완료</button><button data-v="0">미완료</button></div></div>
    <div class="f" style="flex:2 1 220px"><label for="fQ">이름·사원코드 검색</label><input type="search" id="fQ" placeholder="예: 김미숙, A08544"></div>
    <button class="reset" id="reset">필터 초기화</button>
  </div>

  <section class="panel">
    <div class="ph">
      <h2 id="orgTitle">조직별 참여율</h2>
      <div class="legend"><span><i style="background:var(--blue)"></i>80% 이상</span><span><i style="background:var(--yellow)"></i>50~79%</span><span><i style="background:var(--red)"></i>50% 미만</span><span class="hint">행을 누르면 해당 조직으로 필터됩니다</span></div>
    </div>
    <div class="scroll"><table id="orgTbl"><thead></thead><tbody></tbody></table></div>
  </section>

  <section class="panel">
    <div class="ph"><h2>인원 명단</h2><span class="hint" id="listCount"></span></div>
    <div class="scroll"><table id="pTbl"><thead></thead><tbody></tbody></table></div>
    <button class="more" id="more" hidden>더 보기</button>
  </section>
</div>

const base=()=>P.filter(p=>!(st.ex&&p.ex));
function scoped(){return base().filter(p=>(!st.md||p.md===st.md)&&(!st.team||p.team===st.team));}

function kpis(){
  const s=scoped(), done=s.filter(p=>p.p).length, resp=s.reduce((a,p)=>a+p.n,0), multi=s.filter(p=>p.n>=2).length;

    <td><b>${o.name}</b></td><td class="num">${o.tot}</td><td class="num">${o.done}</td>
    <td class="num" style="color:${o.miss?'var(--red)':'var(--muted)'}">${o.miss}</td>
    <td><div class="bar"><div class="t"><i class="${barCls(o.rate)}" style="width:${o.rate}%"></i></div><b>${o.rate.toFixed(1)}%</b></div></td>
    <td class="num">${o.resp}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">대상 인원이 없습니다</td></tr>';
  $('#orgTbl thead').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;st.orgSort={k,d:st.orgSort.k===k?-st.orgSort.d:(k==='name'?1:-1)};orgTable();});
  $('#orgTbl tbody').querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>{
    const v=tr.dataset.v;
    if(byTeam){st.team=st.team===v?'':v;} else {st.md=v;st.team='';fillMd();}
    fillTeam();render();
  });
}

function people(){
  const q=st.q.trim().toLowerCase();
  let rows=P.filter(p=>(!st.md||p.md===st.md)&&(!st.team||p.team===st.team)
    &&(st.status==='all'||String(p.p)===st.status)&&(!q||p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)));
  if(st.ex && st.status!=='all') rows=rows.filter(p=>!p.ex);
  const {k,d}=st.pSort;
  rows.sort((a,b)=>{let x=a[k],y=b[k];const c=typeof x==='string'?x.localeCompare(y,'ko'):x-y;return c*d||a.md.localeCompare(b.md,'ko')||a.team.localeCompare(b.team,'ko')||a.name.localeCompare(b.name,'ko');});
  const cols=[['md','조직',''],['team','팀',''],['name','이름',''],['code','사원코드',''],['p','참여',''],['n','응답 수','num']];
  $('#pTbl thead').innerHTML='<tr>'+cols.map(c=>`<th data-k="${c[0]}" class="${c[2]}">${c[1]}${arrow(st.pSort,c[0])}</th>`).join('')+'</tr>';
  const shown=rows.slice(0,st.limit);
  $('#pTbl tbody').innerHTML=shown.map(p=>`<tr><td>${p.md}</td><td>${p.team}</td><td><b>${p.name}</b></td><td class="muted">${p.code}</td>
    <td>${p.ex?'<span class="pill ex">예외</span> ':''}${p.p?'<span class="pill ok">완료</span>':'<span class="pill no">미완료</span>'}</td>
    <td class="num ${p.n>=2?'multi':''}">${p.n}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">조건에 맞는 인원이 없습니다. 검색어나 필터를 바꿔 보세요.</td></tr>';
  const done=rows.filter(p=>p.p).length;
  $('#listCount').textContent=`${fmt(rows.length)}명 표시 · 완료 ${fmt(done)} / 미완료 ${fmt(rows.length-done)}`;
  $('#more').hidden=rows.length<=st.limit;
  $('#more').textContent=`더 보기 (${fmt(rows.length-st.limit)}명 남음)`;
  $('#pTbl thead').querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;st.pSort={k,d:st.pSort.k===k?-st.pSort.d:(k==='n'?-1:1)};people();});
}
function render(){kpis();orgTable();people();}

$('#fMd').onchange=e=>{st.md=e.target.value;st.team='';st.limit=200;fillTeam();render();};
$('#fTeam').onchange=e=>{st.team=e.target.value;st.limit=200;render();};
$('#fQ').oninput=e=>{st.q=e.target.value;st.limit=200;people();};
$('#exToggle').onchange=e=>{st.ex=e.target.checked;render();};
$('#fStatus').querySelectorAll('button').forEach(b=>b.onclick=()=>{st.status=b.dataset.v;$('#fStatus').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));st.limit=200;people();});
$('#more').onclick=()=>{st.limit+=300;people();};
$('#reset').onclick=()=>{Object.assign(st,{md:'',team:'',status:'all',q:'',limit:200});$('#fQ').value='';$('#fStatus').querySelectorAll('button').forEach((x,i)=>x.classList.toggle('on',i===0));fillMd();fillTeam();render();};
fillMd();fillTeam();render();
</script>

</body></html>
