:root{--bg:#F3F6FA;--card:#FBFCFE;--ink:#25364A;--mut:#6B7C90;--line:#DCE5EF;--soft:#E9EFF6;--blue:#006ECD;--yellow:#FF9700;--yellow-t:#B35F00;--red:#EF151E;--hero:#006ECD;--use:#006ECD;--past:#8DBBE8;--no:#C3CEDA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1B2E;--card:#12263D;--ink:#EAF2FB;--mut:#9FB3C8;--line:#243D58;--soft:#162E48;--blue:#4DA3F0;--yellow:#FFA928;--yellow-t:#FFB84D;--red:#FF6168;--hero:#0A3D70;--use:#4DA3F0;--past:#6F8FB0;--no:#3A4F66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1B2E;--card:#12263D;--ink:#EAF2FB;--mut:#9FB3C8;--line:#243D58;--soft:#162E48;--blue:#4DA3F0;--yellow:#FFA928;--yellow-t:#FFB84D;--red:#FF6168;--hero:#0A3D70;--use:#4DA3F0;--past:#6F8FB0;--no:#3A4F66;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{-webkit-font-smoothing:antialiased;letter-spacing:-.01em;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;margin:0;line-height:1.35}
header{background:var(--bg);border-top:6px solid var(--blue)}
header .in{max-width:1040px;margin:auto;padding:30px 20px 20px}
header h1{font-size:clamp(22px,4.2vw,32px);max-width:20em;font-weight:700;color:var(--ink)}
header h1::after{content:"";display:block;width:44px;height:4px;background:var(--yellow);margin-top:14px;border-radius:2px}
header .camp{background:var(--soft);border-radius:14px;padding:14px 20px;margin-top:20px;text-align:center;font-size:clamp(16px,2.8vw,21px);font-weight:500;color:var(--ink)}header .camp b{color:var(--blue);font-weight:700}
header h1,header .camp,.callout{word-break:keep-all}
header .camp-d{text-align:center;max-width:none;margin:16px auto 0;color:var(--ink);font-size:clamp(14px,2.2vw,16.5px);line-height:1.8}
header p{color:var(--mut);max-width:42em;margin:12px 0 0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav div{max-width:1040px;margin:auto;display:flex;gap:4px;overflow-x:auto;padding:0 14px}
nav button{font:500 14px inherit;font-family:inherit;border:0;background:none;color:var(--mut);padding:13px 12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.on{color:var(--blue);border-color:var(--blue);font-weight:600}
main{max-width:1040px;margin:auto;padding:24px 20px 80px}
section{display:none}section.on{display:block}
h2{font-size:24px;margin:6px 0 4px}h3{font-size:18px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 18px;max-width:46em}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{border-left:4px solid var(--ink);padding:4px 0 4px 12px}.kpi b{color:var(--ink);display:block;font:700 28px "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}.kpi span{color:var(--mut);font-size:13px}
.kpi.u{border-color:var(--use)}.kpi.u b{color:var(--red)}.kpi.p{border-color:var(--past)}.kpi.x{border-color:var(--no)}
ul.ins{margin:0;padding-left:18px}ul.ins li{margin:7px 0}
.legend{display:flex;gap:14px;font-size:13px;color:var(--mut);margin:0 0 10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.row{display:grid;grid-template-columns:minmax(96px,150px) 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:13.5px}
.row .lb small{color:var(--mut);display:block;font-size:11.5px;line-height:1.2}
.bar{display:flex;height:20px;border-radius:4px;overflow:hidden;background:var(--soft)}
.bar span{display:block;height:100%;font-size:11px;color:#fff;text-align:center;line-height:20px;overflow:hidden}
.bar .u{background:var(--use)}.bar .p{background:var(--past)}.bar .x{background:var(--no)}.bar .s{background:var(--blue)}
.row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.sol{margin-bottom:14px}.sol h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tag{font:500 12px "Pretendard","Noto Sans KR",sans-serif;background:var(--soft);color:var(--blue);border-radius:20px;padding:1px 10px}
.ev{margin:0 0 10px;color:var(--ink)}.sol ul{margin:0;padding-left:18px;color:var(--mut)}.sol li{margin:3px 0}
.note{font-size:13px;color:var(--mut);background:var(--soft);border-radius:8px;padding:10px 14px;margin:0 0 18px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button.b{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);white-space:nowrap;position:sticky;top:0}td.m{min-width:220px;color:var(--mut)}
.st-u{color:var(--blue);font-weight:600}.st-p{color:var(--mut)}.st-x{color:var(--ink)}
.pg{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0;color:var(--mut)}
details{margin-top:22px}
.mb{padding:0;display:flex;flex-direction:column;overflow:hidden}
.mtop{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
#mlist{flex:1;overflow:auto;padding:4px 20px calc(30px + env(safe-area-inset-bottom,0px))}

<div class="grid qa">${qa.map(q=>`<div class="card"><h3>${q[0]}</h3><div class="big${q[2]?' key':''}">${q[1]}</div><p>${q[3]}</p><button class="go" onclick="show(${q[4]})">${q[5]} →</button></div>`).join('')}</div>

$('#s5').innerHTML=`<h2>정제된 데이터</h2><p class="sub">검색과 필터로 매장을 확인할 수 있습니다.</p>
<div class="tools"><input id="q" placeholder="식당명·지역·메모 검색"><select id="fi"><option value="">업종 전체</option>${inds.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id="ft"><option value="">사용 여부 전체</option><option>사용 중</option><option>과거 사용</option><option>미사용</option></select><label style="display:flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" id="fp">우선 공략 대상 (${D.prio}곳)</label></div>
<div class="wrap"><table id="dt"><thead><tr><th>식당명</th><th>지역</th><th>업종</th><th>사용</th><th>사용 제품</th><th>구매처</th><th>현장 메모</th></tr></thead><tbody id="tb"></tbody></table></div><div class="pg"><button class="b" id="pv">이전</button><span id="pi"></span><button class="b" id="nx">다음</button></div>
<details><summary>데이터 정제 내역 (참고)</summary><div class="card"><ul class="ins"><li>원본 ${K.raw.toLocaleString()}건에서 식당명 공란 1건을 제외했습니다.</li><li>상호·지역·응답 내용을 함께 비교해 중복으로 추정한 ${K.removed}건을 삭제했습니다. 같은 상호라도 지역이 다르면 다른 지점으로 보고 남겼습니다.</li><li>자유 입력 업종 약 90종을 10개 그룹으로 통합했습니다. 기준은 아래 ‘업종 통합 기준’에서 볼 수 있습니다.</li><li>최종 ${K.total.toLocaleString()}개 매장을 분석했습니다.</li></ul></div></details>
<details><summary>삭제한 중복 ${D.removed.length}건</summary><p class="note">상호가 같고 지역이 겹치거나 응답 내용이 유사한 항목을 추정해 삭제했습니다. 신뢰도 ‘보통’은 지역 정보가 불충분해 직접 확인을 권장합니다. 남긴 행은 정보가 가장 많은 쪽입니다.</p><div class="wrap"><table><thead><tr><th>원본 행</th><th>삭제 상호</th><th>지역</th><th>사용</th><th>남긴 행</th><th>신뢰도</th></tr></thead><tbody>${D.removed.map(x=>`<tr><td>${x.row}</td><td>${esc(x.name)}</td><td>${esc(x.region)}</td><td style="white-space:nowrap">${esc(x.status)}</td><td>${x.kept} ${esc(x.keptname)}</td><td>${x.conf}</td></tr>`).join('')}</tbody></table></div></details>
<details><summary>업종 통합 기준</summary><div class="wrap"><table><thead><tr><th>통합 업종</th><th>매장 수</th><th>원본 표기 (건수)</th></tr></thead><tbody>${D.indmap.map(o=>`<tr><td>${esc(o.l)}</td><td>${o.n}</td><td class="m">${o.src.map(esc).join(', ')}${o.more?` 외 ${o.more}종`:''}</td></tr>`).join('')}</tbody></table></div></details>`;
let page=0,F=R;const PS=30,cl={'사용 중':'u','과거 사용':'p','미사용':'x'};
function filt(){const q=$('#q').value.trim().toLowerCase(),i=$('#fi').value,t=$('#ft').value,p=$('#fp').checked;
F=R.filter(r=>(!i||r[4]===i)&&(!t||r[6]===t)&&(!p||r[12].includes('pr'))&&(!q||(r[1]+r[2]+r[7]+r[11]).toLowerCase().includes(q)));page=0;draw()}
function draw(){const m=Math.max(1,Math.ceil(F.length/PS));page=Math.min(page,m-1);$('#tb').innerHTML=F.slice(page*PS,page*PS+PS).map(r=>`<tr><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[4])}<br><small style="color:var(--mut)">원본: ${esc(r[5])}</small></td><td class="st-${cl[r[6]]}">${r[6]}</td><td>${esc(r[7])}</td><td>${esc(r[9])}</td><td class="m">${esc(r[11])}</td></tr>`).join('');$('#pi').textContent=`${page+1} / ${m} · ${F.length.toLocaleString()}곳`}
['q','fi','ft','fp'].forEach(id=>$('#'+id).addEventListener(id==='q'?'input':'change',filt));
$('#pv').onclick=()=>{page=Math.max(0,page-1);draw()};$('#nx').onclick=()=>{page++;draw()};draw();
const KN={ind:'업종',ch:'구매처',cr:'중시 기준',rs:'이유',pd:'사용 품목',th:'메모 주제',mt:'메모 주제',mm:'현장 메모',cp:'경쟁 브랜드',st:'사용 여부',pp:'가격 유형',pw:'가격과 함께 고른 이유'};
let BL=[],ML=[],mp=0,fl={};const MS=20;
const tg=(r,p)=>r[12].filter(x=>x.startsWith(p)).map(x=>x.slice(p.length));
const FAC=[['ind','업종',r=>[r[4]]],['ch','구매처',r=>tg(r,'ch:')],['rs','이유',r=>tg(r,'rs:').map(x=>x.split('|')[1])],['cr','중시 기준',r=>tg(r,'cr:')],['pp','가격 유형',r=>tg(r,'pp:')],['mt','메모 주제',r=>tg(r,'mt:').map(x=>x.split('|')[1])]];
const fld=(k,v)=>v?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';
function fbar(){const seg=['전체','사용 중','과거 사용','미사용'].map(s=>{const n=s==='전체'?BL.length:BL.filter(r=>r[6]===s).length;return n||s==='전체'?`<button data-s="${s}" class="${(fl.st||'전체')===s?'on':''}">${s} <small>${n}</small></button>`:''}).join('');
const sel=FAC.map(([k,n,f])=>{const c={};BL.forEach(r=>new Set(f(r)).forEach(v=>c[v]=(c[v]||0)+1));const ks=Object.keys(c).sort((a,b)=>c[b]-c[a]);if(ks.length<2)return'';return `<label>${n}<select data-f="${k}"><option value="">전체</option>${ks.map(v=>`<option value="${esc(v)}"${fl[k]===v?' selected':''}>${esc(v)} (${c[v]})</option>`).join('')}</select></label>`}).join('');
$('#mf').innerHTML=`<div class="seg">${seg}</div><div class="fs">${sel}<label>검색<input id="mq" placeholder="식당명·메모" value="${esc(fl.q||'')}"></label></div>`}
function mdraw(){$('#ml').insertAdjacentHTML('beforeend',ML.slice(mp*MS,mp*MS+MS).map(r=>`<div class="card ent"><div class="t"><b>${esc(r[1])}</b><span class="st-${cl[r[6]]}">${r[6]}</span><small style="color:var(--mut)">${esc(r[4])}${r[5]!==r[4]?' (원본: '+esc(r[5])+')':''}</small></div><dl>${fld('지역',r[2])}${fld('사용 제품',r[7])}${fld('이유',r[8])}${fld('구매처',r[9])}${fld('중시 기준',r[10])}${fld('가격 유형',tg(r,'pp:').filter(x=>x!=='메모 없음').join(', '))}${fld('현장 메모',r[11])}</dl></div>`).join(''));mp++;$('#mm').style.display=mp*MS<ML.length?'':'none'}
function apply(){const q=(fl.q||'').trim().toLowerCase();ML=BL.filter(r=>(!fl.st||fl.st==='전체'||r[6]===fl.st)&&FAC.every(([k,n,f])=>!fl[k]||f(r).includes(fl[k]))&&(!q||(r[1]+r[2]+r[7]+r[8]+r[11]).toLowerCase().includes(q)));mp=0;$('#ml').innerHTML=ML.length?'':'<p class="note">조건에 맞는 매장이 없습니다.</p>';$('#mn').textContent=`${ML.length.toLocaleString()}곳 표시 (전체 ${BL.length.toLocaleString()}곳)`;mdraw();$('#mlist').scrollTop=0}
function openQ(q,t){BL=q==='all'?R:R.filter(r=>r[12].includes(q));fl={};
let ti=t;if(!ti){const [k,v]=q.split(':');ti=(v||'').replace('|',' · ')+(KN[k]?' — '+KN[k]:'')}
$('#mt').textContent=ti;$('#md').hidden=false;document.body.style.overflow='hidden';fbar();apply()}
function closeQ(){$('#md').hidden=true;document.body.style.overflow=''}
document.addEventListener('click',e=>{const h=e.target.closest('[data-q]');if(h)openQ(h.dataset.q,h.dataset.t)});
$('#mf').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b){fl.st=b.dataset.s;fbar();apply()}});
$('#mf').addEventListener('change',e=>{const f=e.target.dataset.f;if(f){fl[f]=e.target.value;apply()}});
$('#mf').addEventListener('input',e=>{if(e.target.id==='mq'){fl.q=e.target.value;apply()}});
$('#mx').onclick=closeQ;$('#mm').onclick=mdraw;$('#md').addEventListener('click',e=>{if(e.target.id==='md')closeQ()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeQ()});
show(+(location.hash.slice(1))||0);
</script></body></html>
