<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>시식가이드</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  /* =========================================================
     🎨 1. 전체 테마 색상 설정 (원하는 색으로 변경 가능)
  ========================================================= */
  :root{
    --bg: #FAFAF7;         /* 배경 아이보리색 */
    --ink: #1F2E22;        /* 기본 진한 글자색 */
    --muted: #767065;      /* 설명용 회색 글자 */
    --line: #E6E1D6;       /* 연한 테두리 선 */
    --card: #FFFFFF;       /* 카드 배경색(흰색) */
    --accent: #E8622C;     /* 메인 강조 주황색 */
    --chip-inactive: #F7F6F2; /* 선택 안 된 카테고리 버튼 색상 */
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    --hover-bg: #F0EFEA;
    --green: #3fae2a;      /* 신제품 뱃지 색상 */
    --red: #e0392b;        /* 인기 뱃지 색상 */
    --blue: #2274A5;       /* 추천 뱃지 색상 */
  }
  
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  a{ text-decoration:none; color:inherit; }
  button{ font-family: inherit; }

  /* =========================================================
     📱 2. 전체 레이아웃 & 상단 검색창 디자인
  ========================================================= */
  .wrap {
    width: 100%;
    max-width: 480px;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  .top{
    background: var(--bg);
    padding: 24px 20px 14px;
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }
  .top h1{
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .top .sub{
    margin: 0 0 20px;
    font-size: 14.5px;
    color: var(--muted);
    font-weight: 500;
  }

  /* 검색창 둥근 네모 디자인 */
  .search-wrap{
    position: relative;
    margin-bottom: 16px;
  }
  .search-wrap input{
    width: 100%;
    padding: 14px 18px 14px 44px;
    font-size: 15.5px;
    font-weight: 600;
    border-radius: 14px;
    border: none;
    background: #F4F3EE;
    color: var(--ink);
    outline: none;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .search-wrap input:focus{
    background: #ECEAE4;
    box-shadow: 0 0 0 2px rgba(232, 98, 44, 0.25);
  }
  .search-wrap input::placeholder{ color: #9C988F; font-weight: 500; }
  .search-icon{
    position:absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    opacity: 0.6;
  }

  /* 가로로 스크롤되는 카테고리 알약 버튼들 */
  .cats{
    display:flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
  }
  .cats::-webkit-scrollbar{ display:none; }
  .chip{
    flex: 0 0 auto;
    padding: 9px 16px;
    border-radius: 999px;
    border: none;
    background: var(--chip-inactive);
    color: var(--muted);
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease, color 0.15s ease;
    white-space: nowrap;
  }
  .chip:active{ transform: scale(0.96); }
  .chip:hover{ background: #ECEAE4; color: var(--ink); }
  .chip.active{ background: var(--ink); color: #fff; }

  /* =========================================================
     📦 3. 제품 카드 리스트 (그리드 2단 배열)
  ========================================================= */
  main{ padding: 20px 18px; width: 100%; flex: 1; }

  /* 카드가 두 줄로 나오게 하는 마법의 CSS */
  .grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  /* 핸드폰 화면이 너무 작으면 1줄로 바뀝니다 */
  @media (max-width: 380px){
    .grid{ grid-template-columns: 1fr; }
  }

  /* 개별 카드 기본 틀 */
  .card{
    display: block;
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    overflow: hidden;
    border: 1.5px solid var(--line);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover{ 
    transform: translateY(-3px); 
    border-color: var(--accent);
    box-shadow: 0 6px 16px rgba(232,98,68,0.12);
  }
  .card:active{ transform: translateY(0); }

  /* 카드 상단 이미지 들어가는 부분 */
  .card-media{
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #F4F3EE;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 44px;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
  }
  .card-media img{ width: 100%; height: 100%; object-fit: cover; }

  /* 카드 왼쪽 위 뱃지(NEW, HIT 등) 자동 색상 변경 로직 */
  .badge{
    position:absolute;
    top: 10px;
    left: 10px;
    font-size: 11.5px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 8px;
    color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .badge[data-type] { background: var(--accent); }
  .badge[data-type*="신제"], .badge[data-type*="NEW"], .badge[data-type*="new"] { background: var(--green); }
  .badge[data-type*="인기"], .badge[data-type*="HIT"], .badge[data-type*="hit"] { background: var(--red); }
  .badge[data-type*="추천"], .badge[data-type*="강추"] { background: var(--blue); }

  /* 카드 하단 텍스트 부분 */
  .card-body{ padding: 14px 16px 18px; }
  
  .card-cat{
    display:inline-block;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    background: #F4F3EE;
    padding: 4px 8px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .card-name{
    font-size: 16px;
    font-weight: 800;
    line-height: 1.4;
    margin: 0 0 14px;
    color: var(--ink);
    min-height: 2.8em;
  }

  /* 시식가이드 보기 회색 버튼 */
  .card-cta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 4px;
    width: 100%;
    padding: 10px 0;
    background: #F4F3EE;
    color: var(--muted);
    font-size: 14px;
    font-weight: 700;
    border-radius: 10px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .card:hover .card-cta { background: var(--ink); color: #fff; }

  /* 검색 결과가 없을 때 보여주는 빈 화면 */
  .empty{
    text-align:center;
    padding: 70px 20px;
    color: var(--muted);
  }
  .empty .emoji{ font-size: 44px; margin-bottom: 14px; }
  .empty p{ font-size: 16px; font-weight: 700; margin: 0; }

  /* =========================================================
     🏠 4. 하단 동동 플로팅 홈 버튼
  ========================================================= */
  .home-btn {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
    z-index: 1000;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .home-btn:hover { background: #2f4333; transform: translateX(-50%) translateY(-2px); }
  .home-btn:active { transform: translateX(-50%) translateY(0); }
  .home-btn svg { width: 22px; height: 22px; display: block; }
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>🔍 통합 시식가이드</h1>
    <p class="sub">다양한 제품의 시식 가이드를 확인하세요</p>

    </div>
    
    <nav class="cats" id="catNav"></nav>
  </header>

  <main>
    <div class="grid" id="productGrid"></div>
    
    <div class="empty" id="emptyState" hidden>
      <div class="emoji">🔎</div>
      <p>찾으시는 제품이 없어요</p>
    </div>
  </main>
</div>

// =========================================================
// 🚫 아래부터는 복잡한 동작(검색, 렌더링)을 담당하는 자바스크립트 코드입니다.
// 가급적 이 아래쪽은 수정하지 않으시는 것이 안전합니다!
// =========================================================

const urlParams = new URLSearchParams(window.location.search);
const initialQuery = urlParams.get('q') || '';
const initialCat = urlParams.get('cat') || '전체';

let activeCategory = '전체';
let searchTerm = initialQuery;

const catNav = document.getElementById('catNav');
const grid = document.getElementById('productGrid');
const searchInput = document.getElementById('searchInput');
const emptyState = document.getElementById('emptyState');

// 초기 검색어가 있다면 검색창에 띄워줍니다.
if(initialQuery) {
  searchInput.value = initialQuery;
}

// 상단 카테고리 알약 버튼들을 화면에 그려주는 함수
function renderChips(){
  const allCats = ['전체', ...CATEGORIES];
  catNav.innerHTML = allCats.map(cat => 
    `<button type="button" class="chip ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">${cat}</button>`
  ).join('');
  
  catNav.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCategory = btn.dataset.cat;
      searchTerm = '';
      searchInput.value = ''; 
      renderChips();
      renderGrid();
    });
  });
}

// 제품 카드들을 화면에 그려주는 함수
function renderGrid(){
  const cleanSearchTerm = searchTerm.replace(/\s+/g, '').toLowerCase();

  const filtered = PRODUCTS.filter(p => {
    const matchesCat = activeCategory === '전체' || p.category === activeCategory;
    
    let matchesSearch = false;
    if (cleanSearchTerm === '') {
      matchesSearch = true; 
    } else {
      const cleanName = p.name.replace(/\s+/g, '').toLowerCase();
      const cleanCategory = p.category.replace(/\s+/g, '').toLowerCase();
      
      let matchesKeyword = false;
      if (p.keywords) {
        matchesKeyword = p.keywords.some(kw => kw.replace(/\s+/g, '').toLowerCase().includes(cleanSearchTerm));
      }

      if (cleanName.includes(cleanSearchTerm) || cleanCategory.includes(cleanSearchTerm) || matchesKeyword) {
        matchesSearch = true;
      }
    }
    return matchesCat && matchesSearch;
  });

  // 검색 결과가 없으면 빈 화면(emptyState)을 보여줍니다.
  if(filtered.length === 0){
    grid.innerHTML = '';
    emptyState.hidden = false;
    return;
  }
  emptyState.hidden = true;

  // 💡 카드 클릭 시 현재 창에서 열리도록 href 속성만 남겨두었습니다. (target="_blank" 제거 완료)
  grid.innerHTML = filtered.map(p => `
    <a class="card" href="${p.link}">
      <div class="card-media">
        ${p.badge ? `<span class="badge" data-type="${p.badge}">${p.badge}</span>` : ''}
        ${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy" />` : `<span>${p.emoji || '🍽️'}</span>`}
      </div>
      <div class="card-body">
        <span class="card-cat">${p.category}</span>
        <p class="card-name">${p.name}</p>
        <div class="card-cta">
          시식가이드 보기 
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </div>
      </div>
    </a>
  `).join('');
}

// 검색창에 글자를 칠 때마다 즉시 검색해주는 이벤트
searchInput.addEventListener('input', (e) => {
  searchTerm = e.target.value;
  if (searchTerm.trim() !== '') {
    activeCategory = '전체';
    renderChips();
  }
  renderGrid();
});

// 처음에 화면에 버튼과 카드들을 그립니다.
renderChips();
renderGrid();

if(initialQuery) {
    activeCategory = '전체';
    renderChips();
    renderGrid();
}
</script>
