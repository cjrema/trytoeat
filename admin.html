<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>현장 데이터 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg: #FAFAF7;
    --card-bg: #FFFFFF;
    --ink: #1F2E22;
    --muted: #767065;
    --line: #E6E1D6;
    --green: #2E7D32;
    --red: #E0392B;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; min-height: 100vh;
    background: var(--bg); color: var(--ink);
    font-family: 'Pretendard', sans-serif;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 600px; padding: 32px 20px 80px; display: flex; flex-direction: column; gap: 20px; }
  .header { text-align: center; }
  .header h1 { font-size: 26px; font-weight: 800; margin: 0 0 6px; }
  .card {
    background: var(--card-bg); border-radius: 18px; padding: 22px 20px;
    border: 1.5px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,0.03);
  }
  .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .list-title { font-size: 16px; font-weight: 800; margin: 0; }
  .btn-group { display: flex; gap: 8px; }
  .btn { padding: 8px 14px; font-size: 12.5px; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; color: #fff; }
  .btn-export { background: var(--green); }
  .btn-reset { background: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
  th, td { padding: 11px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td { font-weight: 700; }
  .badge-status { padding: 3px 7px; border-radius: 6px; font-size: 12px; }
  .status-y { background: #E8F5E9; color: var(--green); }
  .status-n { background: #FFEBEE; color: var(--red); }
  .empty-msg { text-align: center; color: var(--muted); font-size: 13.5px; padding: 36px 0; }
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <h1>현장 등록 데이터 관리 (관리자)</h1>
  </header>

  <section class="card">
    <div class="list-header">
      <h2 class="list-title">전체 내역 (<span id="countDisplay">0</span>건)</h2>
      <div class="btn-group">
        <button id="resetBtn" class="btn btn-reset" type="button">전체 초기화</button>
        <button id="exportBtn" class="btn btn-export" type="button">엑셀(CSV) 다운</button>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>마트</th>
            <th>이름</th>
            <th>유무</th>
            <th>등록일시</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div id="emptyMsg" class="empty-msg">저장된 데이터가 없습니다.</div>
    </div>
  </section>
</div>

<script>
const storageKey = 'field_entry_records';
let records = JSON.parse(localStorage.getItem(storageKey) || '[]');

const tableBody = document.getElementById('tableBody');
const emptyMsg = document.getElementById('emptyMsg');
const countDisplay = document.getElementById('countDisplay');
const exportBtn = document.getElementById('exportBtn');
const resetBtn = document.getElementById('resetBtn');

function renderList() {
  records = JSON.parse(localStorage.getItem(storageKey) || '[]');
  tableBody.innerHTML = '';
  countDisplay.textContent = records.length;

  if (records.length === 0) {
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  records.forEach(item => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${item.mart}</td>
      <td>${item.name}</td>
      <td><span class="badge-status ${item.status === '유' ? 'status-y' : 'status-n'}">${item.status}</span></td>
      <td style="font-weight:400; font-size:12px; color:#767065;">${item.createdAt || '-'}</td>
    `;
    tableBody.appendChild(tr);
  });
}

// 엑셀 CSV 다운로드
exportBtn.addEventListener('click', () => {
  if (records.length === 0) {
    alert('저장된 데이터가 없습니다.');
    return;
  }
  let csvContent = '\uFEFF마트명,이름,유무,등록일시\n';
  records.forEach(r => {
    csvContent += `"${r.mart}","${r.name}","${r.status}","${r.createdAt}"\n`;
  });

  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `현장등록데이터_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});

// 🗑️ 데이터 전체 초기화 기능
resetBtn.addEventListener('click', () => {
  if (records.length === 0) {
    alert('초기화할 데이터가 없습니다.');
    return;
  }
  if (confirm('저장된 모든 데이터를 영구 삭제하시겠습니까?')) {
    localStorage.removeItem(storageKey);
    records = [];
    renderList();
    alert('데이터가 완전히 초기화되었습니다.');
  }
});

renderList();
</script>
</body>
</html>
